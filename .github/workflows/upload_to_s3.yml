name: Send the Config File to S3 once upon merge to main.
on:
  push:
    branches:
      - main
jobs:
  send_to_s3: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: LS
        run: |
          ls -Rl
      - uses: shallwefootball/s3-upload-action@master
        with:
          aws_key_id: ${{ secrets.AWS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY}}
          aws_bucket: ${{ secrets.AWS_BUCKET }}
          source_dir: 'file.json' 
          destination_dir: 'config' # if not specified, a random folder id will be generated.