name: Upload to S3 using a assumed-role
on:
  workflow_call:
    secrets:
      assumed_role:
        required: true
      destination_bucket:
        required: true
    inputs:
      aws_region:
        required: true
        type: string
      file_path:
        required: true
        type: string
jobs:
  send_to_s3: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-region: ${{ inputs.aws_region }}
          role-to-assume: arn:aws:iam::762496739597:role/S3Uploader
          role-session-name: OIDCSession

      - name: Upload to S3
        run: |
          aws s3 sync ${{ inputs.file_path }} s3://${{ secrets.destination_bucket }}